name: Deploy Frontend (React / Vite)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout de código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: 'npm'

      - name: Instalar dependencias y compilar
        run: |
          npm install
          npm run build

      - name: Instalar cliente Cloudflare
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      # Obtener los primeros 7 caracteres del commit
      - name: Obtener SHA corto del commit
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
          
      - name: Configurar clave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Transferir carpeta dist/ a Mictlán mediante SCP nativo
        run: |
          scp -o StrictHostKeyChecking=no \
              -o ProxyCommand="cloudflared access ssh --hostname %h" \
              -r dist/* ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.PROJECT_PATH }}/

      # Ejecutar comandos remotos mediante SSH nativo
      - name: Desplegar en Mictlán vía SSH nativo
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ProxyCommand="cloudflared access ssh --hostname %h" \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
                cd ${{ secrets.PROJECT_PATH }}
                IMAGE_TAG=${{ env.SHORT_SHA }} docker compose up -d --build
                docker image prune -f
          EOF