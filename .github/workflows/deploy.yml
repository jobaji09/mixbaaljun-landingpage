name: Deploy Frontend (React / Vite)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout de código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: 'npm'

      - name: Instalar dependencias y compilar
        run: |
          npm install
          npm run build

      - name: Instalar cliente Cloudflare
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Transferir carpeta dist/ a Mictlán vía SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          proxy_command: cloudflared access ssh --hostname %h
          source: "dist/*"
          target: "${{ secrets.PROJECT_PATH }}"
          strip_components: 1

      - name: Recargar servidor Nginx en Mictlán
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          proxy_command: cloudflared access ssh --hostname %h
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            docker compose exec -T nginx nginx -s reload